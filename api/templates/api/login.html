{% load static %}
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Notable</title><link rel="stylesheet" href="{% static 'api/styles.css' %}"></head>
<body><main style="max-width:520px"><p class="brand">Notable</p><h1>Ваши заметки.</h1><section class="editor"><h2>Вход в аккаунт</h2>
{% if form.errors %}<p role="alert">Неверное имя пользователя или пароль.</p>{% endif %}
<form method="post">{% csrf_token %}<label for="id_username">Имя пользователя</label><input id="id_username" name="username" autocomplete="username" required maxlength="150"><label for="id_password">Пароль</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><div class="actions"><button>Войти</button></div></form>
</section></main></body></html>
